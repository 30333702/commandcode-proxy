services:
  proxy:
    build: .
    ports:
      - "${PROXY_PORT:-3050}:3050"
    environment:
      PORT: "3050"
      # 账号池状态目录（与下方卷对应）
      CCPOOL_DATA_DIR: "/app/data"
    volumes:
      # 持久化账号池：账号、虚拟 Key、统计、日志、面板密码
      - ccpool-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:3050/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  ccpool-data:
